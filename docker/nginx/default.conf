# Formato "combined" estándar (el que espera cualquier analizador de logs) más
# el tiempo de respuesta al final. Frente al formato reducido anterior añade dos
# campos: $http_referer, de dónde llega el visitante, y $http_user_agent, con qué
# navegador y dispositivo. Sin ellos no se puede saber ni la procedencia ni el
# tipo de dispositivo, que es justo lo que interesa medir.
#
# Los registros solo cuentan hacia delante: lo que no se anote hoy se pierde.
#
# Para leerlos con GoAccess:
#   goaccess access.log --log-format='%h %^[%d:%t %^] "%r" %s %b "%R" "%u" %T' \
#                       --date-format='%d/%b/%Y' --time-format='%H:%M:%S'
#
# OJO al tocarlo: las IPs son dato personal y la sección "Registros del
# servidor" de frontend/privacidad.html enumera exactamente lo que se guarda.
# Si se añade o quita un campo, hay que actualizarla.
log_format bdns '$remote_addr - $remote_user [$time_local] "$request" $status '
                '$body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

# Rate limiting: zonas de 10 MB en memoria por IP
limit_req_zone $binary_remote_addr zone=login:10m      rate=10r/m;
limit_req_zone $binary_remote_addr zone=recuperar:10m  rate=3r/m;
limit_req_zone $binary_remote_addr zone=contacto:10m   rate=3r/m;

# Bloque 1: HTTP → redirige todo a HTTPS (salvo /healthz, usado por el
# healthcheck de Docker — evita la redirección y la negociación TLS).
server {
    listen 80;

    access_log /var/log/nginx/access.log bdns;
    error_log  /var/log/nginx/error.log warn;

    # Endpoint propio de Nginx para el healthcheck de Docker.
    # No pasa por el backend ni redirige a HTTPS: confirma que Nginx vive.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloque 2: HTTPS → sirve la aplicación
server {
    listen 443 ssl;

    access_log /var/log/nginx/access.log bdns;
    error_log  /var/log/nginx/error.log warn;

    # Certificado autofirmado (generado con openssl, ver docs/https.md)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Protocolos y cifrados seguros — TLS 1.2 y 1.3 únicamente
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad
    add_header X-Frame-Options        "DENY"             always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header Referrer-Policy        "no-referrer"      always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Archivos estáticos del frontend servidos directamente por Nginx
    root /usr/share/nginx/html;
    index index.html;

    # ───── Modo mantenimiento ─────────────────────────────────────────
    # Si existe el fichero-bandera `maintenance.on` en la raíz del frontend,
    # se devuelve 503 para todo (→ error_page 503 → mantenimiento.html), salvo
    # los assets, la propia página de mantenimiento y el healthcheck, para que
    # la página pueda renderizarse y Docker siga viendo Nginx vivo.
    # Activar/desactivar:  make mantenimiento-on  /  make mantenimiento-off
    set $maintenance 0;
    if (-f /usr/share/nginx/html/maintenance.on) {
        set $maintenance 1;
    }
    if ($uri = /mantenimiento.html) { set $maintenance 0; }
    if ($uri = /healthz)            { set $maintenance 0; }
    if ($uri ~* \.(css|js|webp|png|jpg|jpeg|svg|gif|ico|woff2?|ttf|otf)$) { set $maintenance 0; }
    if ($maintenance = 1) {
        return 503;
    }

    # Rate limiting en login para frenar la fuerza bruta.
    # Ya no hay zona de registro: retirado el alta pública, la creación de
    # cuentas vive en POST /admin/usuarios, tras autenticación de admin.
    location = /auth/login {
        limit_req        zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /auth/recuperar {
        limit_req        zone=recuperar burst=2 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Formulario de contacto: límite estricto para frenar envíos masivos de bots
    location = /contacto/ {
        limit_req        zone=contacto burst=2 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Rutas de la API → proxy al backend (uvicorn, puerto 8000 interno)
    location ~ ^/(convocatorias|solicitudes|estadisticas|auth|privado|admin|agrupaciones|avisos|contacto|health|docs|openapi\.json|redoc)(/|$) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Páginas de error personalizadas
    error_page 404              /404.html;
    error_page 500 502 504      /50x.html;
    # 503 = mantenimiento programado (lo dispara el bloque de arriba). Los 503
    # que devuelve el backend (p. ej. SMTP caído en /contacto/) NO se interceptan
    # (proxy_intercept_errors está desactivado), así que llegan tal cual al cliente.
    error_page 503              /mantenimiento.html;

    # Caché de assets estáticos — imágenes y fuentes raramente cambian
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico|woff2|woff|ttf|otf)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Caché de CSS y JS — corta para que los cambios lleguen pronto
    location ~* \.(css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Todo lo demás → archivos estáticos del frontend
    location / {
        try_files $uri $uri/ =404;
    }
}
