log_format bdns '$remote_addr | $time_local | $request | $status | ${request_time}s';

# Rate limiting: zonas de 10 MB en memoria por IP
limit_req_zone $binary_remote_addr zone=login:10m      rate=10r/m;
limit_req_zone $binary_remote_addr zone=registro:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=recuperar:10m  rate=3r/m;
limit_req_zone $binary_remote_addr zone=contacto:10m   rate=3r/m;

# Bloque 1: HTTP → redirige todo a HTTPS (salvo /healthz, usado por el
# healthcheck de Docker — evita la redirección y la negociación TLS).
server {
    listen 80;

    access_log /var/log/nginx/access.log bdns;
    error_log  /var/log/nginx/error.log warn;

    # Endpoint propio de Nginx para el healthcheck de Docker.
    # No pasa por el backend ni redirige a HTTPS: confirma que Nginx vive.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloque 2: HTTPS → sirve la aplicación
server {
    listen 443 ssl;

    access_log /var/log/nginx/access.log bdns;
    error_log  /var/log/nginx/error.log warn;

    # Certificado autofirmado (generado con openssl, ver docs/https.md)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Protocolos y cifrados seguros — TLS 1.2 y 1.3 únicamente
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad
    add_header X-Frame-Options        "DENY"             always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header Referrer-Policy        "no-referrer"      always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Archivos estáticos del frontend servidos directamente por Nginx
    root /usr/share/nginx/html;
    index index.html;

    # Rate limiting en login y registro para frenar fuerza bruta y creación masiva de cuentas
    location = /auth/login {
        limit_req        zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /auth/registro {
        limit_req        zone=registro burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /auth/recuperar {
        limit_req        zone=recuperar burst=2 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Formulario de contacto: límite estricto para frenar envíos masivos de bots
    location = /contacto/ {
        limit_req        zone=contacto burst=2 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Rutas de la API → proxy al backend (uvicorn, puerto 8000 interno)
    location ~ ^/(convocatorias|solicitudes|estadisticas|auth|privado|admin|agrupaciones|avisos|contacto|health|docs|openapi\.json|redoc)(/|$) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Páginas de error personalizadas
    error_page 404              /404.html;
    error_page 500 502 503 504  /50x.html;

    # Caché de assets estáticos — imágenes y fuentes raramente cambian
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico|woff2|woff|ttf|otf)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Caché de CSS y JS — corta para que los cambios lleguen pronto
    location ~* \.(css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Todo lo demás → archivos estáticos del frontend
    location / {
        try_files $uri $uri/ =404;
    }
}
