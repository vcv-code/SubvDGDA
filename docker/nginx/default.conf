server {
    listen 80;

    # Cabeceras de seguridad
    add_header X-Frame-Options       "DENY"            always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header Referrer-Policy       "no-referrer"     always;

    # Archivos estáticos del frontend servidos directamente por Nginx
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de la API → proxy al backend (uvicorn, puerto 8000 interno)
    location ~ ^/(convocatorias|solicitudes|estadisticas|auth|privado|agrupaciones|health|docs|openapi\.json|redoc)(/|$) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Todo lo demás → archivos estáticos del frontend
    location / {
        try_files $uri $uri/ =404;
    }
}
