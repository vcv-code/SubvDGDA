log_format bdns '$remote_addr | $time_local | $request | $status | ${request_time}s';

# Bloque 1: HTTP → redirige todo a HTTPS
server {
    listen 80;

    access_log /var/log/nginx/access.log bdns;
    error_log  /var/log/nginx/error.log warn;

    return 301 https://$host$request_uri;
}

# Bloque 2: HTTPS → sirve la aplicación
server {
    listen 443 ssl;

    access_log /var/log/nginx/access.log bdns;
    error_log  /var/log/nginx/error.log warn;

    # Certificado autofirmado (generado con openssl, ver docs/https.md)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Protocolos y cifrados seguros — TLS 1.2 y 1.3 únicamente
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad
    add_header X-Frame-Options        "DENY"             always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header Referrer-Policy        "no-referrer"      always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Archivos estáticos del frontend servidos directamente por Nginx
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de la API → proxy al backend (uvicorn, puerto 8000 interno)
    location ~ ^/(convocatorias|solicitudes|estadisticas|auth|privado|agrupaciones|avisos|health|docs|openapi\.json|redoc)(/|$) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Todo lo demás → archivos estáticos del frontend
    location / {
        try_files $uri $uri/ =404;
    }
}
