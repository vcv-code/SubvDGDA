services:
  db:
    image: mariadb:11.8
    container_name: bdns_dgda_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Atado al loopback: Docker escribe sus reglas de red POR DELANTE de las
      # de ufw, así que un puerto publicado en todas las interfaces queda
      # accesible desde internet aunque el cortafuegos lo deniegue. Desde el
      # propio equipo se sigue llegando igual; desde fuera, por túnel SSH.
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init/modelo-fisico.sql:/docker-entrypoint-initdb.d/modelo-fisico.sql
    healthcheck:
      # healthcheck.sh es el script oficial de mariadb:11.
      # Si falla al arrancar, sustituir por:
      #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      # start_period es imprescindible con volumen NUEVO (make reset-db o
      # primera instalación): MariaDB tarda ~1 min en inicializar los ficheros
      # y cargar modelo-fisico.sql. Sin esto, los fallos cuentan desde el
      # segundo 0, se agotan los 5 reintentos (~50 s) y el contenedor queda
      # marcado unhealthy justo antes de estar listo — con lo que backend,
      # cron y adminer no arrancan y `up -d` falla. Durante start_period los
      # fallos no cuentan, así que no ralentiza el arranque normal.
      start_period: 180s

  mailpit:
    image: axllent/mailpit
    container_name: bdns_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP — el backend envía emails aquí
      - "127.0.0.1:8025:8025"   # Web UI — http://localhost:8025

  backend:
    build: ../backend
    container_name: bdns_api
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_DIR: /app/logs
      CRON_LOG_DIR: /app/cronlogs
      # Correo saliente. Sin nada en .env apunta a Mailpit, que no pide
      # usuario ni cifrado: es el comportamiento de desarrollo de siempre.
      # En producción se rellenan estas variables en .env con el proveedor
      # real (Gmail, Brevo…), sin tocar este fichero.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_CONTACTO: ${EMAIL_CONTACTO:-}
      # Base de los enlaces de verificación y recuperación que van en los correos.
      SITE_URL: ${SITE_URL:-}
    volumes:
      - ../logs/app:/app/logs
      # Logs del cron en solo lectura, para mostrarlos en el panel admin.
      - ../logs/cron:/app/cronlogs:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # Verifica que FastAPI responde en /health. Detecta cuelgues que
      # no matarían el proceso (deadlocks, bucles), donde restart no actúa.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: bdns_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      # Rutas del certificado, en carpeta aparte: es lo único que cambia entre
      # desarrollo y producción. En el servidor se monta otra encima mediante
      # docker-compose.override.yml, que git ignora.
      - ./nginx-tls:/etc/nginx/tls:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../frontend:/usr/share/nginx/html:ro
      - ../logs/nginx:/var/log/nginx
    depends_on:
      - backend
    healthcheck:
      # /healthz es un endpoint propio de Nginx (no pasa por el backend),
      # responde 200 "ok" sin redirigir a HTTPS. Verifica que Nginx vive.
      # Usamos curl en vez de wget porque el wget de BusyBox en alpine
      # resuelve "localhost" a IPv6 y Nginx solo escucha en IPv4.
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  cron:
    build:
      context: ./cron
    container_name: bdns_cron
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      # Toda la carpeta de logs, no solo la del cron: rotar_logs.py necesita
      # ver también los de nginx y los del backend. Las rutas que ya usaban
      # los scripts (/app/logs/cron) siguen siendo válidas.
      - ../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # Interfaz web para explorar la base de datos — solo desarrollo
  # Acceso: http://localhost:8080
  # Sistema: MySQL, Servidor: db, Usuario y contraseña: los del .env
  adminer:
    image: adminer
    container_name: bdns_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
