services:
  db:
    image: mariadb:11
    container_name: bdns_dgda_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init/modelo-fisico.sql:/docker-entrypoint-initdb.d/modelo-fisico.sql
    healthcheck:
      # healthcheck.sh es el script oficial de mariadb:11.
      # Si falla al arrancar, sustituir por:
      #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    container_name: bdns_api
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      LOG_DIR: /app/logs
    volumes:
      - ../logs/app:/app/logs
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: bdns_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../frontend:/usr/share/nginx/html:ro
      - ../logs/nginx:/var/log/nginx
    depends_on:
      - backend

  cron:
    build:
      context: ./cron
    container_name: bdns_cron
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - ../logs/cron:/app/logs/cron
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # Interfaz web para explorar la base de datos — solo desarrollo
  # Acceso: http://localhost:8080
  # Sistema: MySQL, Servidor: db, Usuario y contraseña: los del .env
  adminer:
    image: adminer
    container_name: bdns_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
