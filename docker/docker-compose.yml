services:
  db:
    image: mariadb:11
    container_name: bdns_dgda_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bdns_dgda
      MYSQL_USER: bdns_user
      MYSQL_PASSWORD: bdns_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init/modelo-fisico.sql:/docker-entrypoint-initdb.d/modelo-fisico.sql
    healthcheck:
      # healthcheck.sh es el script oficial de mariadb:11.
      # Si falla al arrancar, sustituir por:
      #   test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    container_name: bdns_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
