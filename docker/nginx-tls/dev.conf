# Certificado de DESARROLLO: el autofirmado que genera install.sh.
#
# Este fichero se incluye dentro del bloque HTTPS de default.conf y es lo ÚNICO
# que cambia entre entornos, porque la ruta del certificado no puede ser la
# misma: en local es un autofirmado y en el servidor lo emite Let's Encrypt.
#
# En producción NO se edita este fichero. Se monta otra carpeta en su lugar
# mediante docker/docker-compose.override.yml, que git ignora — así el
# repositorio se puede clonar y actualizar en el servidor sin conflictos.
# El procedimiento está en manuales/manual-despliegue.md.
ssl_certificate     /etc/nginx/ssl/server.crt;
ssl_certificate_key /etc/nginx/ssl/server.key;
